# Where llama-server instances live. Run one at a time on 12 GB VRAM.
models:
  7b:
    url: http://127.0.0.1:8080/v1
    name: coder-7b
  14b:
    url: http://127.0.0.1:8080/v1   # same port; restart server with the 14B file
    name: coder-14b

router:
  model_path: data/router/router.joblib
  confidence_threshold: 0.60   # below this, don't trust the pack guess: search all packs

library:
  root: data/library
  index_path: data/library/index_embed.joblib   # tfidf index: data/library/index.joblib
  backend: embed               # step 5b change 2: tfidf | embed (rebuild index after changing)
  embed_url: http://127.0.0.1:8081   # CPU llama-server with the embedding model (never loaded in Python)
  embed_model: nomic-embed-text-v1.5
  top_k: 3
  max_context_chars: 4000      # cap on retrieved text added to the prompt
  query: full                  # first_paragraph = route/search on task description only. Tried 2026-11-26: 19% (no change), slower; reverted
  include_docs: true           # false = recipes only. Tried 2026-11-26: 15% (no change vs v1), reverted
  min_score: 0.91              # boosted embed scale (tools/tune_min_score.py on router seeds: keeps 70% on-topic, drops 62% off-topic)
  gate_on: score              # raw = gate before recipe boost. Tried raw 0.61 + max_refs 1 on 2026-11-26: 19% vs 21%, reverted
  max_refs: 3                 # 1 = only the best chunk (see gate_on note)

prefetch:
  ram_budget_packs: 3          # how many packs to keep "warm" in memory
  # LoRA ids as llama-server numbers them (order of --lora flags). Empty = no adapters yet.
  lora_ids: {}
  #  typescript: 0
  #  react: 1
  #  node: 2

eval:
  export_check: false   # tried 2026-11-26 (runs 18-19): plain 22%->22% but slower; stream +1 pt only, 21.4 s/task (over budget). Reverted.
  repair_retry: true    # step 5 change 3: one retry with compiler errors (solution compiled alone)
  format_rules: true    # step 5 change 2: repeat output-format rules at the end of the prompt
  timeout_seconds: 20   # per tool (tsc / vitest) is 6x this
